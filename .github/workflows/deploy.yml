name: Deploy image

# Runs only when you push a version tag (v1.2.3) or click "Run workflow".
# A normal commit to main does NOT start this workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# If two deploys start at once, the newer one wins.
concurrency:
  group: deploy-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/4lbatr0s/vigil

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  build-and-push:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image tags
        id: tags
        run: |
          SHORT=${GITHUB_SHA::7}
          TAGS="${IMAGE}:prod
          ${IMAGE}:sha-${SHORT}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAGS="${TAGS}
          ${IMAGE}:${GITHUB_REF_NAME}"
          fi
          {
            echo "list<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
